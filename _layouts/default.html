<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="icon" type="image/jpeg" href="{{ '/assets/branding/th1nkn3st/th1nkn3st_studio_icon.jpg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/studio.css?v=3' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/brand.css?v=2' | relative_url }}">
    {% seo %}
</head>

<body>
    <a class="st-skip" href="#main">Skip to content</a>
    <header class="st-header">
        <a href="{{ '/' | relative_url }}" class="st-brand">
            <img src="{{ '/assets/branding/th1nkn3st/th1nkn3st_studio_icon.jpg' | relative_url }}" alt="" width="44" height="44">
            <span class="studio-wordmark">Th1nkn3st<sup>™</sup></span>
        </a>
        <nav class="st-nav" aria-label="Main navigation">
            <a href="{{ '/#projects' | relative_url }}">Games &amp; apps</a>
            <a href="{{ '/#studio' | relative_url }}">About</a>
            <a href="{{ '/contact/' | relative_url }}" {% if page.url == '/contact/' %}aria-current="page"{% endif %}>Support &amp; contact</a>
        </nav>
    </header>

    <main class="st-main" id="main">
        {{ content }}
    </main>

    <footer class="st-footer">
        <div class="st-footer-top"><p><strong class="studio-wordmark">Th1nkn3st<sup>™</sup></strong> · Independent games &amp; apps</p><nav aria-label="Footer"><a href="{{ '/crownlines/' | relative_url }}">Crownlines</a><a href="{{ '/print-profit/' | relative_url }}">Print Profit</a><a href="{{ '/contact/' | relative_url }}">Support</a><a href="{{ '/print-profit/privacy/' | relative_url }}">Print Profit privacy</a></nav></div>
        <div class="st-footer-bottom"><p>© {{ 'now' | date: "%Y" }} {{ site.title }}. All rights reserved.</p><a href="mailto:{{ site.email }}">{{ site.email }}</a></div>
    </footer>
</body>
</html>
