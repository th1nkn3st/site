<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/logo.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/studio.css?v=1' | relative_url }}">
    {% seo %}
</head>

<body>
    <header class="st-header">
        <a href="{{ '/' | relative_url }}" class="st-brand">
            <img src="{{ '/assets/logo.svg' | relative_url }}" alt="" width="36" height="36">
            <span>{{ site.title }}</span>
        </a>
        <nav class="st-nav">
            <a href="{{ '/#projects' | relative_url }}">Projects</a>
            <a href="{{ '/contact/' | relative_url }}" {% if page.url == '/contact/' %}aria-current="page"{% endif %}>Contact</a>
        </nav>
    </header>

    <main class="st-main">
        {{ content }}
    </main>

    <footer class="st-footer">
        <p><a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
        <p>© {{ 'now' | date: "%Y" }} {{ site.title }}</p>
    </footer>
</body>
</html>
