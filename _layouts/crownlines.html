<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="icon" type="image/png" href="{{ '/assets/images/crownlines/icon_play_512.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/crownlines.css?v=1' | relative_url }}">
    {% seo %}
</head>

<body>
    <header class="cl-header">
        <a href="{{ '/crownlines/' | relative_url }}" class="cl-brand">
            <img src="{{ '/assets/images/crownlines/icon_play_512.png' | relative_url }}" alt="" width="40" height="40">
            <span>Crownlines</span>
        </a>
        <nav class="cl-nav">
            <a href="{{ '/crownlines/' | relative_url }}" {% if page.url == '/crownlines/' %}aria-current="page"{% endif %}>Game</a>
            <a href="{{ '/crownlines/privacy/' | relative_url }}" {% if page.url == '/crownlines/privacy/' %}aria-current="page"{% endif %}>Privacy</a>
        </nav>
    </header>

    <main class="cl-main">
        {{ content }}
    </main>

    <footer class="cl-footer">
        <p>Crownlines is made by <a href="{{ '/' | relative_url }}">{{ site.title }}</a>. Contact: <a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
        <p>© {{ 'now' | date: "%Y" }} {{ site.title }}</p>
    </footer>
</body>
</html>
