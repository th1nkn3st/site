name: Build site

# Runs the same Jekyll build GitHub Pages uses, so a broken page fails the PR
# instead of the live deploy.
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build with Jekyll (GitHub Pages)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Check app pages
        run: python3 new_app.py --check _site

      - name: Check launch pages and teaser visibility
        run: python3 tools/check_site.py _site

      - name: Upload built site
        continue-on-error: true # Preview retention must not block checks if artifact storage is full.
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7
