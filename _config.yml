# Site settings
title: "th1nkn3st"
description: "A nest for curious minds. Independent games of strategy, adventure and discovery."
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://www.th1nkn3st.com" # must match CNAME; th1nkn3st.com redirects here

# Author information
author: "th1nkn3st"
email: "hello@th1nkn3st.com"

# Social media handles
# Commented out until accounts are created
# social:
#   twitter: th1nkn3st
#   pinterest: th1nkn3st
#   instagram: th1nkn3st
#   tiktok: th1nkn3st
#   linkedin: company/th1nkn3st
social:

# Build settings
theme: jekyll-theme-hacker
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Minima theme settings
minima:
  social_links:
    twitter: th1nkn3st
    github: th1nkn3st
    linkedin: company/th1nkn3st
    rss: rss
  
# Navigation menu
header_pages:
  - blog.md

# SEO and social
twitter:
  username: th1nkn3st
  card: summary_large_image

# Site content settings
show_excerpts: true
excerpt_separator: <!--more-->

# Pagination (disabled for now)
# paginate: 5
# paginate_path: "/blog/page:num/"

# Collections
collections:
  tools:
    output: true
    permalink: /:collection/:name/
  gear:
    output: true
    permalink: /:collection/:name/
  gaming:
    output: true
    permalink: /gaming/:slug/
  geek:
    output: true
    permalink: /geek/:slug/
  diy:
    output: true
    permalink: /diy/:slug/

# Default front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Th1nkN3st Team"
      author_avatar: "/assets/images/author/avatar.png"
  - scope:
      path: ""
      type: "tools"
    values:
      layout: "legacy"
  - scope:
      path: ""
      type: "gear"
    values:
      layout: "gear"
  - scope:
      path: ""
      type: "gaming"
    values:
      layout: "article"
      author: "Th1nkN3st Team"
  - scope:
      path: ""
      type: "geek"
    values:
      layout: "article"
      author: "Th1nkN3st Team"
  - scope:
      path: ""
      type: "diy"
    values:
      layout: "article"
      author: "Th1nkN3st Team"

# Exclude files from processing
exclude:
  - assets/branding/th1nkn3st/SOURCE.md
  - tools/
  - assets/images/the-chaos-system/
  - BRAND.md
  - internal-docs/
  - tmp/
  - MAINTAINER.md
  - QUICK_START.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - n8n_tools/
  - new_app.py
  - generate_redirects.py
  - add_redirect.sh

# Include files
include:
  - _pages
  - .well-known

# Markdown settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Timezone
timezone: America/New_York
