title: "th1nkn3st"
description: "A nest for curious minds. Independent games of strategy, adventure and discovery."
url: "https://www.th1nkn3st.com"
baseurl: ""
lang: en-US
author: th1nkn3st
email: hello@th1nkn3st.com
timezone: America/New_York

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

include:
  - .well-known

exclude:
  - README.md
  - BRAND.md
  - MAINTAINER.md
  - LICENSE
  - NOTICE.md
  - Gemfile
  - Gemfile.lock
  - tools/
  - new_app.py
  - internal-docs/
  - tmp/
  - node_modules/
  - vendor/
  - assets/branding/th1nkn3st/SOURCE.md
  - assets/images/the-chaos-system/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
